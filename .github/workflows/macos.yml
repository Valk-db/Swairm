name: macos-swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Configure Git for SwiftPM
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

  # End-to-end: real Python Anchor + Swift phone fleet over HTTP.
  # Proves the Swift .npz codec is byte-compatible with numpy's.
  integration:
    runs-on: macos-15
    needs: build-test
    steps:
      - uses: actions/checkout@v5

      - name: Configure Git for SwiftPM
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anchor dependencies
        run: pip install numpy scikit-learn fastapi uvicorn

      # Exercises the full worker path (enqueue -> drain_once -> aggregate ->
      # snapshot) without HTTP. Catches worker-side errors (e.g. NameError in
      # drain_once) that otherwise only surface as silently stalled rounds.
      - name: Anchor self-test (worker path)
        run: |
          python main.py --selftest
          rm -rf queue models state.json

      - name: Start Anchor (fast aggregation interval)
        run: |
          FCS_AGG_INTERVAL_S=5 nohup uvicorn main:app --host 127.0.0.1 --port 8000 > anchor.log 2>&1 &
          ANCHOR_PID=$!
          # Wait for Anchor to fully start (includes TLS cert generation on first run)
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/status; then
              echo "Anchor started successfully"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/status; then
            echo "=== Anchor process status ==="
            ps aux | grep uvicorn || echo "uvicorn not running"
            echo "=== Anchor log ==="
            cat anchor.log
            echo "=== Killing anchor ==="
            kill $ANCHOR_PID 2>/dev/null || true
            exit 1
          fi

      - name: Run Swift fleet against the Anchor
        run: swift run swairm-client --anchor http://127.0.0.1:8000 --fleet 1 --rounds 1 --interval 8

      - name: Verify aggregation rounds happened
        run: |
          curl -sf http://127.0.0.1:8000/status -o status.json
          cat status.json
          python -c "import json; s = json.load(open('status.json')); assert s['version'] >= 1, s; print('OK: version advanced to', s['version'])"

      - name: Show Anchor log
        if: always()
        run: cat anchor.log

  # Real on-device MLX DoRA training loop end-to-end against the real Anchor.
  # Downloads a tiny MLX model, generates a synthetic curriculum, then runs
  # Sources/swairm-mlx-client (real fetch -> prepare -> AdamW DoRA train ->
  # export -> upload) and asserts the Anchor version advanced (round aggregated).
  # Needs macos-26 (Xcode 26: MLXLMCommon 3.x requirement); `swift run`
  # provides the Metal backend that XCTest cannot load on the runner.
  mlx-e2e:
    runs-on: macos-26
    needs: build-test
    steps:
      - uses: actions/checkout@v5

      - name: Configure Git for SwiftPM
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Anchor + tooling dependencies
        run: pip install numpy scikit-learn fastapi uvicorn huggingface_hub prometheus-client acme josepy cryptography

      - name: Download tiny MLX model
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p = snapshot_download(
              "mlx-community/Qwen3-0.6B-bf16",
              local_dir="models/mlx-model",
          )
          print("model at", p)
          PY

      - name: Generate synthetic curriculum
        run: |
          python tools/make_curriculum.py \
            --vocab 32000 \
            --sequences 512 \
            --seq-len 64 \
            --out curriculum/epoch_0

      - name: Copy curriculum to Documents (MLXDeviceLoop resolves to Documents)
        run: |
          mkdir -p ~/Documents/curriculum
          cp -R curriculum/epoch_0 ~/Documents/curriculum/
          ls -la ~/Documents/curriculum/epoch_0

      - name: Start Anchor (fast aggregation interval)
        run: |
          rm -f state.json
          FCS_AGG_INTERVAL_S=5 nohup uvicorn main:app --host 127.0.0.1 --port 8000 > anchor.log 2>&1 &
          ANCHOR_PID=$!
          # Wait for Anchor to fully start (includes TLS cert generation on first run)
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/status; then
              echo "Anchor started successfully"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/status; then
            echo "=== Anchor process status ==="
            ps aux | grep uvicorn || echo "uvicorn not running"
            echo "=== Anchor log ==="
            cat anchor.log
            echo "=== Killing anchor ==="
            kill $ANCHOR_PID 2>/dev/null || true
            exit 1
          fi

      # mlx-swift's SwiftPM build never compiles the Metal kernels into a
      # metallib (its only build plugin is CUDA-only), so MLX's Metal backend
      # cannot find its library for a bare `swift run` executable. Reproduce
      # upstream mlx's CMake recipe: compile each kernel .metal to .air with
      # `xcrun metal`, link with `xcrun metallib`, then drop it next to the
      # binary. MLX's colocated-library fallback (get_colocated_mtllib_path in
      # mlx/backend/metal/device.h) resolves <dir-of-that-binary>/mlx.metallib:
      # it dladdr()s an inline header function so the directory is wherever the
      # Cmlx-containing image sits (the swift-run bin dir for debug builds),
      # and the filename is lib_name("mlx") + ".metallib".
      #
      # NOTE on kernel set: Package.swift declares `from: "0.10.0"`, but
      # SwiftPM `from:` on a 0.x allows any <1.0.0, so the resolver picks the
      # LATEST mlx-swift (0.31.6 at time of writing) -- whose vendored mlx
      # kernel set differs completely from 0.10.0's (no gather.metal/
      # scatter.metal; adds rms_norm/sdpa/fft/ternary/steel-conv/steel-attn).
      # So DON'T hard-code a kernel list: glob every *.metal on disk and
      # compile it, mirroring upstream's CMake unconditional set. The only
      # on-disk kernels upstream gates out are:
      #   - fence.metal          (MLX_METAL_VERSION >= 320 only)
      #   - *_nax.metal (6 files)(Metal-4 AND macOS SDK >= 26.2 only; runner
      #                          SDK is 26.0, and MLX_METAL_NO_NAX is defined)
      # Globbing what's actually on disk makes this robust to future 0.x
      # drift. Flags match the SHA's kernels/CMakeLists.txt METAL_FLAGS.
      - name: Build MLX metallib from vendored kernels
        run: |
          set -e
          swift build
          # Resolve the vendored mlx source root and kernels dir on disk rather
          # than hard-coding a path -- the checkout layout (submodule/symlink)
          # differs from upstream's repo layout.
          KDIR=$(find .build/checkouts/mlx-swift -type d -path '*backend/metal/kernels' | head -1)
          echo "kernels dir: $KDIR"
          MLX_DIR=$(dirname "$(dirname "$(dirname "$(dirname "$KDIR")")")")
          echo "include root (-I): $MLX_DIR"
          AIRS=$(mktemp -d)
          # Compile every *.metal under the kernels tree except the gated-out
          # fence.metal and *_nax.metal (see comment above). -x metal forces
          # Metal-source language; the two -Wno-c++XX-extensions match upstream
          # METAL_FLAGS so newer headers that use c++17/20 extensions compile.
          n=0
          while IFS= read -r f; do
            base=$(basename "$f" .metal)
            case "$base" in
              fence|*_nax) echo "skip (gated): $base"; continue ;;
            esac
            xcrun -sdk macosx metal -x metal -Wall -Wextra -fno-fast-math \
              -Wno-c++17-extensions -Wno-c++20-extensions \
              -c "$f" -I"$MLX_DIR" -o "$AIRS/$base.air"
            n=$((n+1))
          done < <(find "$KDIR" -name '*.metal' | sort)
          echo "=== compiled $n .air files ==="
          ls -1 "$AIRS"/*.air
          BINDIR=$(swift build --show-bin-path)
          xcrun -sdk macosx metallib "$AIRS"/*.air -o "$BINDIR/mlx.metallib"
          ls -la "$BINDIR/mlx.metallib"

      - name: Run real MLX fleet (4 devices, 1 rounds, 10 steps)
        run: |
          swift run swairm-mlx-client \
            --anchor http://127.0.0.1:8000 \
            --model models/mlx-model \
            --curriculum curriculum/epoch_0 \
            --fleet 1 \
            --rounds 1 \
            --max-steps 1 \
            --batch-size 1 \
            --seq-len 64

      - name: Verify aggregation rounds happened
        run: |
          curl -sf http://127.0.0.1:8000/status -o status.json
          cat status.json
          python -c "import json; s = json.load(open('status.json')); assert s['version'] >= 1, s; print('OK: version advanced to', s['version'])"
      
      - name: Verify /metrics is live (D14)
        run: |
          curl -sf http://127.0.0.1:8000/metrics -o metrics.txt
          cat metrics.txt
          grep -q '^fcs_current_version' metrics.txt
          grep -q '^fcs_aggregation_rounds_total' metrics.txt
          echo "OK: /metrics serving real gauges/counters, not the 503 no-op path"
          
      - name: Show Anchor log
        if: always()
        run: cat anchor.log

  # Sideloadable iOS app: build unsigned in CI, re-sign locally with
  # Sideloadly (App/project.yml pins the no-codesign settings).
  sideload-ipa:
    runs-on: macos-15
    needs: build-test
    steps:
      - uses: actions/checkout@v5

      - name: Configure Git for SwiftPM
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd App && xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild build \
            -project App/Swairm.xcodeproj \
            -scheme SwairmApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ".build/ios/Build/Products/Release-iphoneos/SwairmApp.app" Payload/
          zip -qry Swairm-unsigned.ipa Payload
          ls -la Swairm-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swairm-unsigned-ipa
          path: Swairm-unsigned.ipa
          retention-days: 14